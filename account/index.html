<script>
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const u = params.get('username');
        const p = params.get('Password');
        const msg = document.getElementById('message');

        // Logic to check credentials
        if (u === "admin" && p === "password123") {
            // REDIRECT: Change 'protected.html' to the actual name of your second file
            window.location.href = "protected.html#authorized";
        } else if (u || p) {
            msg.textContent = "Invalid Credentials. Try again:";
        }
    };
</script>

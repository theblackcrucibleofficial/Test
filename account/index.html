<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #loginBox { padding: 30px; border-radius: 12px; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        input { display: block; margin: 15px auto; padding: 10px; width: 200px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div id="loginBox">
        <h2>Secure Access</h2>
        <input type="text" id="uIn" placeholder="Username">
        <input type="password" id="pIn" placeholder="Password">
        <button id="loginBtn">Login</button>
        <p id="message" style="color:red; font-weight:bold; margin-top:10px;"></p>
    </div>

    <script>
        document.getElementById('loginBtn').onclick = function() {
            const u = document.getElementById('uIn').value;
            const p = document.getElementById('pIn').value;
            
            if (u === "admin" && p === "password123") {
                // Redirects specifically to your success folder with the authorization hash
                window.location.href = "https://theblackcrucibleofficial.github.io/Test/success/#authorized";
            } else {
                document.getElementById('message').textContent = "Invalid Credentials";
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Success</title>
    <style>
        body { background: #27ae60; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        #secretContent { display: none; }
    </style>
</head>
<body>
    <div id="mask"><h1>Validating Session...</h1></div>
    
    <div id="secretContent">
        <h1>ACCESS GRANTED</h1>
        <p>Welcome, Administrator.</p>
    </div>

    <script>
        // Only shows the content if the URL ends in #authorized
        if(window.location.hash === "#authorized") {
            document.getElementById('mask').style.display = "none";
            document.getElementById('secretContent').style.display = "block";
        } else {
            document.getElementById('mask').innerHTML = "<h1>403 - Forbidden</h1>";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Protected Area</title>
    <style>
        body { background: #2c3e50; color: white; font-family: sans-serif; text-align: center; padding-top: 100px; }
        #content { display: none; }
    </style>
</head>
<body>
    <div id="lock"><h1>403 - Forbidden Area</h1><p>Manual entry is restricted.</p></div>
    <div id="content"><h1>ACCESS GRANTED</h1><p>Sensitive data unlocked.</p></div>

    <script>
        // Only reveals if accessed via the tool's success logic (#authorized)
        if(window.location.hash === "#authorized") {
            document.getElementById('lock').style.display = "none";
            document.getElementById('content').style.display = "block";
        }
    </script>
</body>
</html>

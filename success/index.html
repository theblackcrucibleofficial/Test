<script>
    // 1. Check if the hash is present
    if (window.location.hash === "#authorized") {
        document.getElementById('lock').style.display = "none";
        document.getElementById('content').style.display = "block";
    } else {
        // 2. If NOT authorized, show an alert and send them back to login
        alert("Access Denied: You must login first.");
        window.location.href = "login.html"; // Change to your login filename
    }
</script>
